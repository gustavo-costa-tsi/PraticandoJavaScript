/*Solicite ao usuário a distância de uma viagem (em km) e o consumo médio do carro (em km/l). Calcule quantos litros de combustível serão necessários para a viagem. Exiba no formato: Você precisará de XX litros para percorrer YY km */

<script>

let cidade = prompt("Para onde você vai?");
let distancia = parseInt(prompt(`Qual a distância até ${cidade} em km?`));
let consumoMedio = parseInt(prompt("Qual o consumo médio do seu veículo em km/l"));

let litros = (distancia/consumoMedio); 

alert(`Você precisara de ${litros} litros para ir até ${cidade}`);

</script>
